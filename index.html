<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F2A24">
<link rel="preload" as="image" href="img/chef-192.webp">
<title>ReCéTaMe</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="img/icono-192.png">
<link rel="apple-touch-icon" href="img/icono-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ReCéTaMe">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --papel:#F5F0E6; --papel2:#EAE3D4; --blanco:#FFFDF8;
  --tinta:#1F2A24; --tinta2:#4A574E; --suave:#8A9188; --linea:#E2DACB;
  --tomate:#C9502F; --tomate-bg:#F8E4DC; --oliva:#6E7F35; --oliva-bg:#E9EDD8;
  --azafran:#E0A535; --azafran-bg:#FBF0D6;
  --radio:22px; --sombra:0 1px 2px rgba(31,42,36,.06),0 8px 24px rgba(31,42,36,.09);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{-webkit-text-size-adjust:100%;background:var(--papel);color:var(--tinta);font-family:Inter,system-ui,sans-serif;font-size:16px;line-height:1.45}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;touch-action:manipulation}
img{display:block;max-width:100%}
.app{max-width:620px;margin:0 auto;min-height:100vh;padding:calc(env(safe-area-inset-top) + 18px) 18px calc(env(safe-area-inset-bottom) + 40px)}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:700;letter-spacing:-.01em;line-height:1.15}
b,strong{font-weight:700}

/* Cabecera */
.cab{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.marca{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:56px;height:56px;border-radius:17px;overflow:hidden;flex-shrink:0;box-shadow:var(--sombra);background:#01372A}
.logo img{width:100%;height:100%;display:block}
.marca .t{font-family:Fraunces,serif;font-size:30px;font-weight:700;line-height:1}
.marca .s{font-size:13px;color:var(--suave);margin-top:3px}
.redondo{width:44px;height:44px;border-radius:50%;background:var(--blanco);box-shadow:var(--sombra);display:grid;place-items:center;font-size:19px;flex-shrink:0}
.redondo.osc{background:var(--tinta);color:var(--papel)}

/* Buscador y chips */
.buscar{position:relative;margin-bottom:12px}
.buscar input{width:100%;padding:14px 44px 14px 46px;border-radius:16px;border:1.5px solid var(--linea);background:var(--blanco);font-size:16px;outline:none}
.buscar input:focus{border-color:var(--tinta2)}
.buscar .lupa{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--suave);font-size:17px}
.buscar .borrar{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:32px;height:32px;border-radius:50%;background:var(--papel2);display:none;place-items:center;font-size:14px}
.buscar.con .borrar{display:grid}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 18px 6px;margin:0 -18px 14px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;padding:8px 14px;border-radius:999px;background:var(--blanco);border:1.5px solid var(--linea);font-size:14px;font-weight:600;color:var(--tinta2);white-space:nowrap}
.chip.on{background:var(--tinta);border-color:var(--tinta);color:var(--papel)}
.chip .n{opacity:.6;font-weight:500;margin-left:4px}

/* Rejilla de recetas */
.rejilla{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tarjeta{background:var(--blanco);border-radius:var(--radio);box-shadow:var(--sombra);overflow:hidden;text-align:left;display:flex;flex-direction:column;width:100%}
.portada{aspect-ratio:4/3;display:grid;place-items:center;font-size:52px;position:relative;background-size:cover;background-position:center}
.portada .fav{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:50%;background:rgba(255,253,248,.92);display:grid;place-items:center;font-size:15px}
.tarjeta .cuerpo{padding:12px 13px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.tarjeta .tt{font-family:Fraunces,serif;font-size:16.5px;font-weight:700;line-height:1.2;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tarjeta .meta{font-size:12.5px;color:var(--suave);margin-top:auto;display:flex;gap:10px}
.vacio{text-align:center;color:var(--suave);padding:48px 12px}
.vacio .e{font-size:44px;margin-bottom:8px}

/* Colores por categoría */
.c0{background-color:#E9EDD8}.c1{background-color:#F8E1D2}.c2{background-color:#F6DCD5}.c3{background-color:#DDEAF0}.c4{background-color:#F1E3CC}
.c5{background-color:#F7EACB}.c6{background-color:#F6E6C4}.c7{background-color:#EEDDE6}.c8{background-color:#FBF0D6}.c9{background-color:#E4E8DC}

/* Ficha de receta */
.volver{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.ficha-portada{border-radius:26px;aspect-ratio:16/10;display:grid;place-items:center;font-size:96px;box-shadow:var(--sombra);background-size:cover;background-position:center;margin-bottom:18px}
.ficha h1{font-size:30px;margin-bottom:6px}
.ficha .sub{color:var(--tinta2);font-size:15.5px;margin-bottom:12px}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;font-size:13px;font-weight:600;background:var(--papel2);color:var(--tinta2)}
.pill.oliva{background:var(--oliva-bg);color:var(--oliva)}
.card{background:var(--blanco);border-radius:var(--radio);box-shadow:var(--sombra);padding:18px}
.card+.card{margin-top:14px}
.etq{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--suave)}
.macros{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.macro{background:var(--papel);border-radius:14px;padding:10px 4px;text-align:center}
.macro .v{font-family:Fraunces,serif;font-size:22px;font-weight:700;line-height:1.1}
.macro .l{font-size:11.5px;color:var(--suave);margin-top:2px}
.macro.k{background:var(--tinta);color:var(--papel)}
.macro.k .l{color:#B9C4BC}
.raciones{display:flex;align-items:center;justify-content:space-between;gap:12px}
.raciones h2{font-size:22px}
.paso-n{display:flex;align-items:center;gap:10px}
.paso-n button{width:40px;height:40px;border-radius:50%;background:var(--papel2);font-size:22px;font-weight:600;display:grid;place-items:center}
.paso-n .num{font-family:Fraunces,serif;font-size:26px;font-weight:700;min-width:30px;text-align:center}
.ings{list-style:none;margin-top:12px}
.ings li{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--linea);cursor:pointer}
.ings li:first-child{border-top:0}
.ings .marca-i{width:22px;height:22px;border-radius:7px;border:2px solid var(--linea);flex-shrink:0;margin-top:1px;display:grid;place-items:center;font-size:13px;color:#fff}
.ings li.ok .marca-i{background:var(--oliva);border-color:var(--oliva)}
.ings li.ok .nom{text-decoration:line-through;color:var(--suave)}
.ings .nom{flex:1}
.ings .nota{font-size:13px;color:var(--suave);margin-top:2px}
.ings .cant{font-weight:700;white-space:nowrap;text-align:right}
.pasos{list-style:none;margin-top:6px}
.pasos li{display:grid;grid-template-columns:34px 1fr;gap:12px;padding:14px 0;border-top:1px solid var(--linea)}
.pasos li:first-child{border-top:0}
.pasos .nn{width:34px;height:34px;border-radius:50%;background:var(--tinta);color:var(--papel);display:grid;place-items:center;font-weight:700;font-size:15px}
.pasos h3{font-size:17.5px;margin-bottom:4px}
.prog{display:inline-block;background:var(--azafran-bg);color:#8A5A0B;border-radius:10px;padding:4px 9px;font-size:13px;font-weight:600;margin-bottom:6px}
.texto{color:var(--tinta2);font-size:15.5px}
.texto p+p{margin-top:6px}
.consejos{list-style:none;margin-top:8px}
.consejos li{padding:10px 0 10px 30px;position:relative;border-top:1px solid var(--linea);color:var(--tinta2);font-size:15px}
.consejos li:first-child{border-top:0}
.consejos li::before{content:'💡';position:absolute;left:0;top:10px}

/* Botones */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px;border-radius:16px;background:var(--tinta);color:var(--papel);font-weight:600;font-size:16px}
.btn.sec{background:var(--papel2);color:var(--tinta)}
.btn.peligro{background:var(--tomate-bg);color:var(--tomate)}
.btn.tomate{background:var(--tomate);color:#fff}
.btn:disabled{opacity:.5}
.botones{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.btn-peq{padding:8px 14px;border-radius:11px;font-weight:600;font-size:14px;background:var(--papel2)}
.flotante{position:fixed;right:max(18px,calc(50% - 292px));bottom:calc(env(safe-area-inset-bottom) + 20px);width:60px;height:60px;border-radius:20px;background:var(--tomate);color:#fff;font-size:30px;display:grid;place-items:center;box-shadow:0 8px 24px rgba(201,80,47,.35);z-index:20}

/* Modo cocina */
.cocina{position:fixed;inset:0;background:var(--tinta);color:var(--papel);z-index:50;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 14px) 20px calc(env(safe-area-inset-bottom) + 18px)}
.cocina .arriba{display:flex;justify-content:space-between;align-items:center;gap:10px}
.cocina .redondo{background:rgba(255,255,255,.1);color:var(--papel);box-shadow:none}
.cocina .tit{font-size:14px;color:#B9C4BC;text-align:center;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.barra{height:5px;border-radius:3px;background:rgba(255,255,255,.12);margin:14px 0 0;overflow:hidden}
.barra i{display:block;height:100%;background:var(--azafran);transition:width .25s}
.cocina .centro{flex:1;overflow:auto;padding:26px 2px}
.cocina .contador{font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--azafran)}
.cocina h2{font-size:30px;margin:8px 0 12px}
.cocina .prog{font-size:17px;padding:8px 14px;margin-bottom:14px;background:rgba(224,165,53,.18);color:#F3CE7E}
.cocina .texto{color:#EEF2EE;font-size:21px;line-height:1.5}
.cocina .abajo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cocina .btn.sec{background:rgba(255,255,255,.1);color:var(--papel)}
.cocina .btn{background:var(--azafran);color:var(--tinta);padding:18px;font-size:17px}
.cocina .wl{font-size:12px;color:#8FA095;text-align:center;margin-top:10px}

/* Hoja inferior */
.velo{position:fixed;inset:0;background:rgba(31,42,36,.4);opacity:0;pointer-events:none;transition:opacity .2s;z-index:60}
.velo.on{opacity:1;pointer-events:auto}
.hoja{position:fixed;left:50%;bottom:0;transform:translate(-50%,105%);width:min(620px,100%);max-height:86vh;overflow:auto;background:var(--blanco);color:var(--tinta);border-radius:26px 26px 0 0;padding:10px 20px calc(env(safe-area-inset-bottom) + 24px);z-index:61;transition:transform .25s ease}
.hoja:not(.on){visibility:hidden;transition:transform .25s ease,visibility 0s .25s}
.hoja.on{transform:translate(-50%,0)}
.hoja .asa{width:44px;height:5px;border-radius:3px;background:var(--linea);margin:4px auto 14px}
.hoja h2{font-size:23px;margin-bottom:6px}

/* Formularios */
.campo{margin-top:14px}
.campo>label{display:block;font-size:13px;font-weight:600;color:var(--tinta2);margin-bottom:6px}
.campo input,.campo textarea,.campo select,.fila-ing input,.paso-ed input,.paso-ed textarea{width:100%;padding:12px 13px;border-radius:13px;border:1.5px solid var(--linea);background:var(--blanco);font-size:16px;outline:none}
.campo input:focus,.campo textarea:focus,.fila-ing input:focus,.paso-ed input:focus,.paso-ed textarea:focus{border-color:var(--tinta2)}
.campo textarea,.paso-ed textarea{resize:vertical;min-height:84px}
.ayuda{font-size:13px;color:var(--suave);margin-top:6px}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cuatro{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cuatro input{text-align:center;padding:12px 6px}
.cuatro small{display:block;text-align:center;font-size:11.5px;color:var(--suave);margin-top:4px}
.sel-cats{display:flex;flex-wrap:wrap;gap:8px}
.fila-ing{display:grid;grid-template-columns:72px 84px 1fr 38px;gap:6px;margin-top:10px;align-items:start;background:var(--papel);border-radius:16px;padding:8px}
.fila-ing .nom-in{grid-column:1/4}
.fila-ing .nota-in{grid-column:3/5}
.quitar{width:38px;height:46px;border-radius:12px;background:var(--tomate-bg);color:var(--tomate);font-size:16px}
.paso-ed{background:var(--papel);border-radius:16px;padding:12px;margin-top:10px;display:grid;gap:8px}
.paso-ed .cab-p{display:flex;align-items:center;justify-content:space-between}
.paso-ed .cab-p b{font-family:Fraunces,serif;font-size:17px}
.paso-ed .acc{display:flex;gap:6px}
.paso-ed .acc button{width:34px;height:34px;border-radius:10px;background:var(--blanco);font-size:14px}
.paso-ed .acc .x{background:var(--tomate-bg);color:var(--tomate)}
.foto-prev{border-radius:18px;aspect-ratio:16/10;background:var(--papel2) center/cover;display:grid;place-items:center;color:var(--suave);font-size:14px;margin-bottom:8px}
.mas{width:100%;padding:12px;border-radius:13px;border:1.5px dashed var(--linea);color:var(--tinta2);font-weight:600;margin-top:10px}
.seccion{font-family:Fraunces,serif;font-size:21px;margin:26px 0 2px}

/* Aviso */
.aviso{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 14px);transform:translate(-50%,-160%);background:var(--tinta);color:var(--papel);padding:12px 18px;border-radius:14px;font-size:14px;font-weight:500;z-index:80;transition:transform .25s;max-width:calc(100% - 32px);text-align:center}
.aviso.on{transform:translate(-50%,0)}
.aviso.error{background:var(--tomate)}
.cargando{text-align:center;color:var(--suave);padding:60px 0}
.pie{text-align:center;font-size:12.5px;color:var(--suave);margin-top:28px}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="velo" id="velo" onclick="cerrarHoja()"></div>
<div class="hoja" id="hoja"></div>
<div class="aviso" id="aviso"></div>

<script>
/* ============ CONFIGURACIÓN ============ */
const VERSION_APP = '1.2';
const API = 'https://script.google.com/macros/s/AKfycbxN4ZFdC8Ci31OKdtnWfAFjbkxe72K3fogh09CZBdf9HS-X0M6CBCTs2mFDecMBh7WO/exec';
const CATEGORIAS = [
  ['Ensaladas y platos fríos', '🥗'], ['Airfryer - Horno', '🔥'], ['Carnes y salteados', '🍗'],
  ['Pescado', '🐟'], ['Guisos', '🍲'], ['Cremas y sopas', '🥣'], ['Arroces', '🥘'],
  ['Bebidas y elixires', '🍷'], ['Omelettes y huevos', '🍳'], ['Aperitivos', '🫒']
];

/* ============ ESTADO ============ */
const S = {
  recetas: [], version: '', cargado: false,
  cat: 'todas', q: '',
  favs: leerLS('rm_favs', []),
  clave: leerLS('rm_clave', ''),
  hechos: {}, // ingredientes marcados, por receta
  rac: {}     // raciones elegidas, por receta
};
const $ = s => document.querySelector(s);

function leerLS(k, def){ try { const v = localStorage.getItem(k); return v === null ? def : JSON.parse(v); } catch(e){ return def; } }
function guardarLS(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }

function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c])); }
/** Texto con **negritas** y saltos de línea. */
function md(s){
  return String(s || '').split(/\n+/).map(l => '<p>' + esc(l).replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/\*([^*]+)\*/g, '<b>$1</b>') + '</p>').join('');
}
function norm(s){ return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); }
function aviso(t, error){ const a = $('#aviso'); a.textContent = t; a.className = 'aviso on' + (error ? ' error' : ''); clearTimeout(a._t); a._t = setTimeout(() => a.className = 'aviso', 2600); }

function idxCat(c){ const i = CATEGORIAS.findIndex(x => x[0] === c); return i < 0 ? 9 : i; }
function emojiCat(c){ const x = CATEGORIAS.find(x => x[0] === c); return x ? x[1] : '🍽️'; }
function iconoDe(r){ return r.icono || emojiCat((r.categorias || [])[0]); }
function claseDe(r){ return 'c' + idxCat((r.categorias || [])[0]); }
/** Las fotos de Drive admiten tamaño en la URL: así las tarjetas cargan rápido. */
function fotoTam(url, w){ return /googleusercontent\.com\/d\//.test(url) ? url.replace(/=w\d+$/, '') + '=w' + w : url; }
function portadaEstilo(r, w){ return r.foto ? `style="background-image:url('${esc(fotoTam(r.foto, w || 600))}')"` : ''; }

/* ============ DATOS ============ */
async function apiGet(accion){
  const r = await fetch(API + '?accion=' + accion, { cache: 'no-store' });
  return r.json();
}
async function apiPost(datos){
  // text/plain evita la comprobación previa (CORS) de Apps Script.
  const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(datos) });
  return r.json();
}
function leerCache(){
  const c = leerLS('rm_cache', null);
  if (c && Array.isArray(c.recetas)) { S.recetas = c.recetas; S.version = c.version; S.cargado = true; }
}
async function refrescar(forzar){
  try {
    if (!forzar && S.cargado) {
      const v = await apiGet('version');
      if (v.ok && v.version === S.version) return;
    }
    const d = await apiGet('listar');
    if (!d.ok) throw new Error(d.error);
    S.recetas = d.recetas; S.version = d.version; S.cargado = true;
    guardarLS('rm_cache', { recetas: S.recetas, version: S.version });
    if (!$('#hoja').classList.contains('on') && !document.querySelector('.cocina') && !location.hash.startsWith('#/editar')) pintar();
    if (forzar) aviso('Recetas actualizadas ✓');
  } catch(e) {
    if (!S.cargado) { S.cargado = true; pintar(); }
    if (forzar) aviso('Sin conexión con la hoja de recetas', true);
  }
}
function receta(id){ return S.recetas.find(r => String(r.id) === String(id)); }

/* ============ RUTAS ============ */
function ir(h){ location.hash = h; }
window.addEventListener('hashchange', () => { liberarPantalla(); pintar(); window.scrollTo(0, 0); });

function pintar(){
  const h = location.hash.replace(/^#\/?/, '');
  const [vista, id] = h.split('/');
  if (vista === 'r' && receta(id)) return vReceta(receta(id));
  if (vista === 'cocina' && receta(id)) return vCocina(receta(id), 0);
  if (vista === 'editar' && esAdmin()) return vEditar(id === 'nueva' ? null : receta(id));
  vInicio();
}

/* ============ INICIO ============ */
function vInicio(){
  const app = $('#app');
  if (!S.cargado) { app.innerHTML = cabecera() + '<div class="cargando">Cargando recetas…</div>'; return; }
  const cuenta = {};
  S.recetas.forEach(r => (r.categorias || []).forEach(c => cuenta[c] = (cuenta[c] || 0) + 1));
  const chips = [`<button class="chip ${S.cat === 'todas' ? 'on' : ''}" onclick="elegirCat('todas')">Todas<span class="n">${S.recetas.length}</span></button>`,
    `<button class="chip ${S.cat === 'favs' ? 'on' : ''}" onclick="elegirCat('favs')">★ Favoritas<span class="n">${S.favs.filter(f => receta(f)).length}</span></button>`]
    .concat(CATEGORIAS.filter(([c]) => cuenta[c]).map(([c, e]) => `<button class="chip ${S.cat === c ? 'on' : ''}" onclick="elegirCat('${esc(c)}')">${e} ${esc(c)}<span class="n">${cuenta[c]}</span></button>`));
  app.innerHTML = cabecera() + `
    <div class="buscar ${S.q ? 'con' : ''}" id="buscar">
      <span class="lupa">🔍</span>

function cabecera(){

function buscar(v){ S.q = v; $('#buscar').classList.toggle('con', !!v); pintarLista(); }
function filtradas(){
  const q = norm(S.q).trim();
  let l = S.recetas.slice();
  if (S.cat === 'favs') l = l.filter(r => S.favs.includes(String(r.id)));
  else if (S.cat !== 'todas') l = l.filter(r => (r.categorias || []).includes(S.cat));

  return l.sort((a, b) => a.titulo.localeCompare(b.titulo, 'es'));

/* ============ RECETA ============ */
function racionesDe(r){ return S.rac[r.id] || Number(r.raciones) || 1; }
const UNID_PESO = ['g', 'ml', 'kg', 'l', 'cl'];
function fmtNum(v){
  const e = Math.floor(v), f = v - e;
  const fr = [[0, ''], [0.25, '¼'], [0.33, '⅓'], [0.5, '½'], [0.67, '⅔'], [0.75, '¾'], [1, '']];
  let mejor = fr[0], d = 9;
  fr.forEach(x => { if (Math.abs(f - x[0]) < d) { d = Math.abs(f - x[0]); mejor = x; } });
  const ent = mejor[0] === 1 ? e + 1 : e;
  if (!mejor[1]) return String(ent);
  return (ent ? ent : '') + mejor[1];
}
function cantidad(i, factor){
  const c = Number(i.cantidad);
  const u = String(i.unidad || '').trim();
  if (!isFinite(c) || i.cantidad === '' || i.cantidad == null || /gusto/i.test(u)) return u || '';
  let v = c * factor;
  if (UNID_PESO.includes(u.toLowerCase())) {
    v = v >= 20 ? Math.round(v / 5) * 5 : (v >= 5 ? Math.round(v) : Math.round(v * 2) / 2);
    return String(v).replace('.', ',') + ' ' + u;
  }
  return (fmtNum(v) || '0') + (u ? ' ' + u : '');
}
function vReceta(r){
  const n = racionesDe(r), f = n / (Number(r.raciones) || 1);
  const hechos = S.hechos[r.id] || [];
  const fav = S.favs.includes(String(r.id));
  const m = r.macros || {};
  const mac = (v, l, k) => `<div class="macro ${k || ''}"><div class="v">${v == null || v === '' ? '–' : Math.round(v)}${k || v == null || v === '' ? '' : '<small style="font-size:13px">g</small>'}</div><div class="l">${l}</div></div>`;
  $('#app').innerHTML = `
    <div class="volver">
      <button class="redondo" onclick="history.length > 1 ? history.back() : ir('#/')" aria-label="Volver">←</button>
      <div style="display:flex;gap:10px">
        <button class="redondo" onclick="compartir('${esc(r.id)}')" aria-label="Compartir">↗</button>
        <button class="redondo" onclick="alternarFav('${esc(r.id)}')" aria-label="Favorita">${fav ? '★' : '☆'}</button>
      </div>
    </div>
    <div class="ficha">
      <div class="ficha-portada ${claseDe(r)}" ${portadaEstilo(r, 1400)}>${r.foto ? '' : iconoDe(r)}</div>
      <h1>${esc(r.titulo)}</h1>
      ${r.subtitulo ? `<p class="sub">${esc(r.subtitulo)}</p>` : ''}
      <div class="pills">${(r.categorias || []).map(c => `<span class="pill oliva">${emojiCat(c)} ${esc(c)}</span>`).join('')}${r.tiempo ? `<span class="pill">⏱️ ${esc(r.tiempo)}</span>` : ''}</div>

      ${r.macros ? `<div class="card"><div class="etq">Por ración</div><div class="macros">
        ${mac(m.kcal, 'kcal', 'k')}${mac(m.proteinas, 'Proteínas')}${mac(m.carbohidratos, 'Hidratos')}${mac(m.grasas, 'Grasas')}</div></div>` : ''}

      <div class="card">
        <div class="raciones"><h2>Ingredientes</h2>
          <div class="paso-n"><button onclick="cambiarRac('${esc(r.id)}',-1)" aria-label="Menos raciones">−</button><span class="num">${n}</span><button onclick="cambiarRac('${esc(r.id)}',1)" aria-label="Más raciones">+</button></div>
        </div>
        <div class="ayuda">${n === 1 ? '1 ración' : n + ' raciones'}${n !== (Number(r.raciones) || 1) ? ` · receta original para ${r.raciones}` : ''} · toca para tachar</div>
        <ul class="ings">${(r.ingredientes || []).map((i, k) => `
          <li class="${hechos.includes(k) ? 'ok' : ''}" onclick="tachar('${esc(r.id)}',${k})">
            <span class="marca-i">${hechos.includes(k) ? '✓' : ''}</span>
            <div class="nom">${esc(i.nombre)}${i.nota ? `<div class="nota">${md(i.nota).replace(/<\/?p>/g, ' ')}</div>` : ''}</div>
            <span class="cant">${esc(cantidad(i, f))}</span></li>`).join('')}</ul>
      </div>

      ${(r.pasos || []).length ? `<button class="btn tomate" style="margin:14px 0" onclick="ir('#/cocina/${esc(r.id)}')">👩‍🍳 Modo cocina</button>
      <div class="card"><h2 style="font-size:22px">Preparación</h2><ol class="pasos">${r.pasos.map((p, k) => `
        <li><span class="nn">${k + 1}</span><div>${p.titulo ? `<h3>${esc(p.titulo)}</h3>` : ''}${p.programa ? `<span class="prog">⚙️ ${esc(p.programa)}</span>` : ''}<div class="texto">${md(p.texto)}</div></div></li>`).join('')}</ol></div>` : ''}

      ${(r.consejos || []).length ? `<div class="card"><h2 style="font-size:22px">Consejos</h2><ul class="consejos">${r.consejos.map(c => `<li>${md(c).replace(/<\/?p>/g, ' ')}</li>`).join('')}</ul></div>` : ''}

      ${esAdmin() ? `<div class="botones"><button class="btn sec" onclick="ir('#/editar/${esc(r.id)}')">✏️ Editar</button><button class="btn peligro" onclick="confirmarBorrar('${esc(r.id)}')">🗑️ Borrar</button></div>` : ''}
    </div>`;
}
function cambiarRac(id, d){ const r = receta(id); S.rac[id] = Math.max(1, Math.min(20, racionesDe(r) + d)); const y = scrollY; vReceta(r); scrollTo(0, y); }
function tachar(id, k){ const h = S.hechos[id] = S.hechos[id] || []; const i = h.indexOf(k); i < 0 ? h.push(k) : h.splice(i, 1); const y = scrollY; vReceta(receta(id)); scrollTo(0, y); }
function alternarFav(id){ id = String(id); const i = S.favs.indexOf(id); i < 0 ? S.favs.push(id) : S.favs.splice(i, 1); guardarLS('rm_favs', S.favs); const y = scrollY; vReceta(receta(id)); scrollTo(0, y); aviso(i < 0 ? 'Añadida a favoritas ★' : 'Quitada de favoritas'); }
async function compartir(id){
  const r = receta(id); const url = location.href.split('#')[0] + '#/r/' + id;
  try { if (navigator.share) await navigator.share({ title: r.titulo, text: r.titulo + ' · ReCéTaMe', url }); else { await navigator.clipboard.writeText(url); aviso('Enlace copiado ✓'); } } catch(e) {}
}

let bloqueo = null;

function liberarPantalla(){ try { if (bloqueo) bloqueo.release(); } catch(e) {} bloqueo = null; }
document.addEventListener('visibilitychange', () => { if (!document.hidden && document.querySelector('.cocina')) mantenerPantalla(); });

function vCocina(r, k){

    <div class="arriba"><button class="redondo" onclick="ir('#/r/${esc(r.id)}')" aria-label="Salir">✕</button>

    </div>

}
function hojaIngredientes(id){

  abrirHoja(`<h2>Ingredientes</h2><div class="ayuda">${racionesDe(r)} raciones</div><ul class="ings">${(r.ingredientes || []).map(i => `<li style="cursor:default"><div class="nom">${esc(i.nombre)}</div><span class="cant">${esc(cantidad(i, f))}</span></li>`).join('')}</ul>`);

async function entrarAdmin(){
  const c = $('#clave').value.trim(); if (!c) return;
  try {
    const d = await apiPost({ accion: 'comprobar', clave: c });
    if (!d.ok) return aviso('Clave incorrecta', true);

  } catch(e) { aviso('Sin conexión', true); }
}
function salirAdmin(){ S.clave = ''; guardarLS('rm_clave', ''); cerrarHoja(); pintar(); aviso('Has salido del modo administrador'); }

async function importarFotosSites(){
  let mapa;
  try { mapa = await (await fetch('datos/fotos-sites.json', { cache: 'no-store' })).json(); }
  catch(e) { return aviso('No se pudo leer la lista de fotos', true); }
  const porCat = {};
  S.recetas.forEach(r => { const m = mapa[r.origen]; if (m && !r.foto) (porCat[m[0]] = porCat[m[0]] || []).push({ id: r.id, indice: m[1] }); });
  const cats = Object.keys(porCat);
  const total = cats.reduce((a, c) => a + porCat[c].length, 0);
  if (!total) return aviso('No hay fotos pendientes de traer');
  let hechas = 0, fallos = 0;
  const pintarProg = () => abrirHoja(`<h2>Trayendo fotos…</h2><p class="ayuda">No cierres la app. Cada foto se guarda en tu carpeta de Drive «ReCéTaMe fotos».</p>
    <div class="barra" style="background:var(--papel2);height:10px;border-radius:5px;margin-top:16px"><i style="width:${Math.round(hechas / total * 100)}%;background:var(--tomate)"></i></div>
    <p style="text-align:center;margin-top:10px;font-weight:600">${hechas} de ${total}${fallos ? ` · ${fallos} con error` : ''}</p>`);
  pintarProg();
  for (const c of cats) {
    const items = porCat[c];
    for (let i = 0; i < items.length; i += 4) {
      const lote = items.slice(i, i + 4);
      try {
        const d = await apiPost({ accion: 'fotosSites', clave: S.clave, categoria: c, items: lote });
        if (!d.ok) throw new Error(d.error);
        d.resultado.forEach(x => { if (x.ok && x.foto) { const r = receta(x.id); if (r) r.foto = x.foto; } if (!x.ok) fallos++; });
      } catch(e) { fallos += lote.length; }
      hechas += lote.length; pintarProg();
    }
  }
  guardarLS('rm_cache', { recetas: S.recetas, version: S.version });
  await refrescar(true);
  abrirHoja(`<h2>${fallos ? 'Fotos traídas, con algún error' : '¡Fotos listas! 🖼️'}</h2><p class="ayuda">${total - fallos} de ${total} recetas tienen ya su foto.${fallos ? ' Vuelve a pulsar el botón para reintentar las que fallaron.' : ''}</p><button class="btn" style="margin-top:14px" onclick="cerrarHoja();pintar()">Ver recetas</button>`);
}

function confirmarBorrar(id){
  const r = receta(id);
  abrirHoja(`<h2>¿Borrar «${esc(r.titulo)}»?</h2><p class="ayuda">Se borrará de la hoja y su foto irá a la papelera de Drive. No se puede deshacer desde la app.</p>
    <div class="botones"><button class="btn sec" onclick="cerrarHoja()">Cancelar</button><button class="btn tomate" onclick="borrar('${esc(id)}')">Borrar</button></div>`);

async function borrar(id){
  try {
    const d = await apiPost({ accion: 'borrar', clave: S.clave, id });
    if (!d.ok) throw new Error(d.error);
    S.recetas = S.recetas.filter(r => String(r.id) !== String(id)); S.version = d.version;
    guardarLS('rm_cache', { recetas: S.recetas, version: S.version });
    cerrarHoja(); ir('#/'); aviso('Receta borrada');
  } catch(e) { aviso('No se pudo borrar: ' + e.message, true); }
}

          <button class="x" onclick="ED.pasos.splice(${k},1);vEditar(receta(ED._para))" aria-label="Quitar">✕</button></div></div>
        <input placeholder="Título del paso" value="${esc(p.titulo)}" oninput="ED.pasos[${k}].titulo=this.value">
        <input placeholder="Programa (opcional). Ej.: Monsieur Cuisine · 8 min / 120 °C / Vel 1" value="${esc(p.programa)}" oninput="ED.pasos[${k}].programa=this.value">
        <textarea placeholder="Qué hay que hacer" oninput="ED.pasos[${k}].texto=this.value">${esc(p.texto)}</textarea>
      </div>`).join('')}</div>
    <button class="mas" onclick="ED.pasos.push({titulo:'',texto:'',programa:''});vEditar(receta(ED._para))">＋ Añadir paso</button>

    <div class="seccion">Consejos</div>
    <div class="campo"><textarea placeholder="Un consejo por línea" oninput="ED.consejos=this.value.split('\\n').map(s=>s.trim()).filter(Boolean)">${esc((ED.consejos || []).join('\n'))}</textarea>
      <p class="ayuda">Para poner algo en negrita, escríbelo entre dobles asteriscos: **así**.</p></div>

    <button class="btn tomate" id="btn-guardar" style="margin-top:22px" onclick="guardarReceta()">Guardar receta</button>
    <button class="btn sec" style="margin-top:10px" onclick="cancelarEdicion()">Cancelar</button>`;
}
function alternarCatEd(c){ const i = ED.categorias.indexOf(c); i < 0 ? ED.categorias.push(c) : ED.categorias.splice(i, 1); const y = scrollY; vEditar(receta(ED._para)); scrollTo(0, y); }
function ponerMacro(k, v){ ED.macros = ED.macros || {}; ED.macros[k] = v === '' ? null : Number(v); }
function moverPaso(k, d){ const p = ED.pasos.splice(k, 1)[0]; ED.pasos.splice(k + d, 0, p); const y = scrollY; vEditar(receta(ED._para)); scrollTo(0, y); }
function cancelarEdicion(){ const para = ED && ED._para; ED = null; ir(para && para !== 'nueva' ? '#/r/' + para : '#/'); }
function elegirFoto(inp){
  const f = inp.files[0]; if (!f) return;
  const img = new Image(), url = URL.createObjectURL(f);
  img.onload = () => {
    const MAX = 1280, s = Math.min(1, MAX / Math.max(img.width, img.height));
    const c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    ED._foto = c.toDataURL('image/jpeg', 0.8); ED._quitarFoto = false; URL.revokeObjectURL(url);
    const y = scrollY; vEditar(receta(ED._para)); scrollTo(0, y);
  };
  img.src = url;
}
async function guardarReceta(){
  if (!ED.titulo.trim()) return aviso('Falta el título', true);
  if (!ED.categorias.length) return aviso('Elige al menos una categoría', true);
  const r = Object.assign({}, ED);
  delete r._para; delete r._foto; delete r._quitarFoto;
  r.titulo = r.titulo.trim();
  r.ingredientes = (r.ingredientes || []).filter(i => String(i.nombre).trim());
  r.pasos = (r.pasos || []).filter(p => String(p.texto).trim() || String(p.titulo).trim());
  if (r.macros && Object.values(r.macros).every(v => v == null)) r.macros = null;
  const b = $('#btn-guardar'); b.disabled = true; b.textContent = ED._foto ? 'Subiendo foto y guardando…' : 'Guardando…';
  try {
    const d = await apiPost({ accion: 'guardar', clave: S.clave, receta: r, foto: ED._foto || null, quitarFoto: ED._quitarFoto });
    if (!d.ok) throw new Error(d.error);
    const i = S.recetas.findIndex(x => String(x.id) === String(d.receta.id));
    i < 0 ? S.recetas.push(d.receta) : (S.recetas[i] = d.receta);
    S.version = d.version; guardarLS('rm_cache', { recetas: S.recetas, version: S.version });
    ED = null; ir('#/r/' + d.receta.id); aviso('Receta guardada ✓');
  } catch(e) { b.disabled = false; b.textContent = 'Guardar receta'; aviso('No se pudo guardar: ' + e.message, true); }
}

/* ============ ARRANQUE ============ */
if ('serviceWorker' in navigator) {
  const habiaControl = !!navigator.serviceWorker.controller;
  let recargando = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!habiaControl || recargando) return;
    const ocupado = () => $('#hoja').classList.contains('on') || document.querySelector('.cocina') || location.hash.startsWith('#/editar');
    const recargar = () => { recargando = true; sessionStorage.setItem('rm_actualizada', '1'); location.reload(); };
    if (!ocupado()) recargar();
    else { const t = setInterval(() => { if (!ocupado()) { clearInterval(t); recargar(); } }, 2000); }
  });
  window.addEventListener('load', async () => {
    try {
      const reg = await navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' });
      const b = () => reg.update().catch(() => {});
      document.addEventListener('visibilitychange', () => { if (!document.hidden) b(); });
      setInterval(b, 15 * 60 * 1000);
    } catch(e) {}
  });
  if (sessionStorage.getItem('rm_actualizada')) { sessionStorage.removeItem('rm_actualizada'); setTimeout(() => aviso('App actualizada ✓'), 600); }
}
leerCache();
pintar();
refrescar();
document.addEventListener('visibilitychange', () => { if (!document.hidden) refrescar(); });
</script>
